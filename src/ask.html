<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Ask</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, sans-serif;
        line-height: 1.4;
      }
      body {
        margin: 24px;
      }
      h1 {
        font-size: 1.15rem;
        font-weight: 650;
        margin: 0 0 8px;
      }
      p {
        margin: 0 0 16px;
      }
      label {
        display: block;
        font-weight: 600;
        margin-bottom: 6px;
      }
      textarea {
        width: 100%;
        height: 96px;
        box-sizing: border-box;
        font: inherit;
        padding: 6px 8px;
        resize: vertical;
      }
      button {
        font: inherit;
        padding: 6px 12px;
      }
      .actions {
        display: flex;
        justify-content: flex-end;
        margin-top: 16px;
      }
      [role="alert"] {
        color: #9f2d1e;
        min-height: 1.4em;
        margin: 12px 0 0;
      }
      #answer {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        margin: 16px 0 0;
      }
    </style>
  </head>
  <body>
    <h1>Ask</h1>
    <p>
      Answers come from your own Pages, with citations, and end with how far the vault is filed.
      Nothing you ask is stored.
    </p>
    <form id="ask-form">
      <label for="question">Question</label>
      <textarea id="question" name="question" autofocus></textarea>
      <p id="error" role="alert"></p>
      <div class="actions">
        <button type="submit" id="ask-button">Ask</button>
      </div>
    </form>
    <p id="answer"></p>
    <script src="ask.js"></script>
  </body>
</html>
