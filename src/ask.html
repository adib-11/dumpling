<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Ask</title>
    <link rel="stylesheet" href="theme.css" />
    <style>
      body {
        margin: var(--space-6);
      }
      p {
        color: var(--text-muted);
      }
      textarea {
        display: block;
        width: 100%;
        height: 96px;
        box-sizing: border-box;
        resize: vertical;
      }
      #answer {
        color: var(--text);
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        margin: var(--space-4) 0 0;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Ask</h1>
      <p>
        Answers come from your own Pages, with citations, and end with how far the vault is filed.
        Nothing you ask is stored.
      </p>
      <form id="ask-form">
        <label for="question">Question</label>
        <textarea id="question" name="question" autofocus></textarea>
        <p id="error" role="alert"></p>
        <div class="actions">
          <button type="submit" id="ask-button">Ask</button>
        </div>
      </form>
      <p id="answer" aria-live="polite"></p>
    </main>
    <script src="ask-box.js"></script>
  </body>
</html>
